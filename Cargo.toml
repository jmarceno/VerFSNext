[workspace]
members = [
    ".",
    "crates/verfsnext-async-fusex",
    "crates/verfsnext-surrealkv",
]
resolver = "2"

[package]
name = "verfsnext"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "verfsnext"
path = "src/lib.rs"

[[bin]]
name = "verfsnext"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.97"
argon2 = "0.5.3"
verfsnext-async-fusex = { path = "crates/verfsnext-async-fusex" }
async-trait = "0.1.88"
bytecheck = "0.8.2"
chacha20poly1305 = "0.10.1"
crc32c = "0.6.8"
futures = "0.3.31"
moka = { version = "0.12.10", features = ["sync"] }
nix = { version = "0.26.4", features = ["fs", "signal", "socket", "user"] }
parking_lot = "0.12.3"
rand = "0.8.5"
rayon = "1.11.0"
rkyv = { version = "0.8.15" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
verfsnext-surrealkv = { path = "crates/verfsnext-surrealkv" }
tokio = { version = "1.44.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.14"
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
zeroize = "1.8.1"
zstd = "0.13.3"

# Desktop GUI (tray + setup wizard + control center). Exact pins: cxx /
# cxx-qt / cxx-qt-lib / cxx-qt-build must move together.
cxx = { version = "=1.0.176", optional = true }
cxx-qt = { version = "=0.10.0", optional = true }
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"], optional = true }
crossbeam-channel = { version = "=0.5.15", optional = true }
ksni = { version = "=0.2.2", optional = true }
resvg = { version = "=0.48.1", default-features = false, optional = true }
usvg = { version = "=0.48.1", default-features = false, optional = true }
zbus = { version = "=4.4.0", default-features = false, features = ["tokio", "blocking"], optional = true }

[build-dependencies]
cxx-qt-build = { version = "=0.10.0", features = ["link_qt_object_files"], optional = true }
# Not used directly: pins the C++ generator to the `cxx` runtime version.
cxx-gen = { version = "=0.7.176", optional = true }

[features]
default = ["gui"]
# Build without it (`--no-default-features`) for headless servers: no Qt,
# D-Bus or tray libraries are linked and a bare `verfsnext` mounts.
gui = [
    "dep:cxx",
    "dep:cxx-qt",
    "dep:cxx-qt-lib",
    "dep:cxx-qt-build",
    "dep:cxx-gen",
    "dep:crossbeam-channel",
    "dep:ksni",
    "dep:resvg",
    "dep:usvg",
    "dep:zbus",
]

# Save disk space: do not generate debug info for dev builds.
# Cargo only applies a top-level `debug` setting to the workspace's own crates,
# so the `package."*"` override is required to also strip dependencies.
[profile.dev]
debug = false

[profile.dev.package."*"]
debug = false
