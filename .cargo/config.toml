# Sync with `cargo remote -h -- ...` (dotfiles are not synced otherwise).
[target.x86_64-unknown-linux-gnu]
rustflags = [
    # clang (used by cxx / cxx-qt builds) can pick a GCC install directory
    # that lacks libstdc++.so and then fails with "cannot find -lstdc++".
    # Adding the common dirs is harmless where they do not exist.
    "-C", "link-arg=-L/usr/lib/gcc/x86_64-linux-gnu/12",
    "-C", "link-arg=-L/usr/lib/gcc/x86_64-linux-gnu/13",
    # The builder defaults to mold, which drops cxx-qt's generated bridge
    # symbols and initializers.
    "-C", "link-arg=-fuse-ld=lld",
]
